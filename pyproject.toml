[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icloud-photos-cli"
version = "0.2.0"
description = "An assistant-friendly command line for an iCloud photo library: durable catalogue, bounded cache, JSON everywhere."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sonstebo" }]
keywords = ["icloud", "photos", "cli", "clip", "face-recognition", "ai-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.11"
dependencies = [
    "pyicloud[cli]>=2.7.0",
    "numpy",
    "onnxruntime>=1.20",
    "insightface>=0.7",
    "opencv-python-headless",
    "tokenizers",
    "sqlite-vec>=0.1.6",
    "pillow",
    "pillow-heif",
]

[project.scripts]
photos = "icloud_photos.cli:main"

[project.urls]
Homepage = "https://github.com/Sonstebo/icloud-photos-cli"
Issues = "https://github.com/Sonstebo/icloud-photos-cli/issues"

[tool.setuptools]
packages = ["icloud_photos"]
